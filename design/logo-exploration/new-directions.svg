" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="52" r="7" fill="#f4a300"/></g><text x="159" y="141" font-size="31" letter-spacing="-.8" font-weight="700">Fächerbagger</text><text x="160" y="168" font-size="14" fill="#595959">Baustellen Karlsruhe</text><text x="28" y="240" font-size="16" fill="#454b6b">Der Anfangsbuchstabe wird zur Straßenverzweigung.</text><text x="28" y="269" font-size="14" fill="#595959">Eigenständige Wortmarke mit einem gelben Startpunkt.</text><path d="M28 292H596" stroke="#eceef2"/><text x="28" y="320" font-size="11" fill="#595959">APP · 48 / 32 / 16 PX</text><rect x="28" y="332" width="48" height="48" rx="10.56" fill="#454b6b"/><g transform="translate(35.2 339.2) scale(0.5249999999999999)" color="#fff"><path d="M18 41V13h35M18 32h27" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="52" r="7" fill="#f4a300"/></g><rect x="88" y="348" width="32" height="32" rx="7.04" fill="#454b6b"/><g transform="translate(92.8 352.8) scale(0.35)" color="#fff"><path d="M18 41V13h35M18 32h27" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="52" r="7" fill="#f4a300"/></g><rect x="132" y="364" width="16" height="16" rx="3.52" fill="#454b6b"/><g transform="translate(134.4 366.4) scale(0.175)" color="#fff"><path d="M18 41V13h35M18 32h27" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="52" r="7" fill="#f4a300"/></g><text x="191" y="320" font-size="11" fill="#595959">EINFARBIG</text><g transform="translate(190 333) scale(.72)" color="#454b6b"><path d="M18 41V13h35M18 32h27" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="52" r="7" fill="currentColor"/></g><text x="301" y="320" font-size="11" fill="#595959">AUF DUNKEL</text><rect x="301" y="331" width="295" height="53" rx="8" fill="#454b6b"/><g transform="translate(309 338) scale(.6)" color="#fff"><path d="M18 41V13h35M18 32h27" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="52" r="7" fill="#f4a300"/></g><text x="358" y="363" font-size="18" font-weight="700" fill="#fff">Fächerbagger</text></g><g transform="translate(704 623)"><rect width="624" height="414" rx="18" fill="#e9ebf1"/><text x="32" y="49" font-size="22" font-weight="700">Was das Zeichen leisten soll</text><g font-size="17" fill="#595959"><text x="32" y="104">Als App-Icon schnell erkennbar sein.</text><text x="32" y="147">Zur ruhigen, sachlichen Oberfläche passen.</text><text x="32" y="190">Auch einfarbig funktionieren.</text><text x="32" y="233">Eine eigene Form statt vieler Details haben.</text></g><path d="M32 269H592" stroke="#cdd1df"/><text x="32" y="309" font-size="18" font-weight="700">Meine Wahl bleibt der Fächer.</text><text x="32" y="341" font-size="16" fill="#595959">V1 bewahrt Karlsruhe und ist klarer als das Original.</text><text x="32" y="370" font-size="16" fill="#595959">A2 ist die Alternative mit dem stärksten Namensbezug.</text></g><text x="48" y="1083" font-size="12" fill="#595959">Bestehende Farbwelt · Dunkelblau #454B6B · Baustellengelb #F4A300</text></g></svg>