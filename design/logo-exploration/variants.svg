<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="1168" viewBox="0 0 1376 1168"><rect width="1376" height="1168" fill="#f4f5f7"/><g font-family="Arial, Helvetica, sans-serif" fill="#454b6b"><text x="48" y="51" font-size="12" letter-spacing="2">FÄCHERBAGGER / WEITERENTWICKLUNG</text><text x="48" y="103" font-size="35" font-weight="700" letter-spacing="-.5">Ein Fächer. Vier unterschiedliche Charaktere.</text><text x="48" y="139" font-size="17" fill="#595959">Varianten von Entwurf 1. Gleiche Farben und Wortmarke, damit die Form entscheidet.</text><g transform="translate(48 163)"><rect width="1280" height="82" rx="12" fill="#e9ebf1"/><g transform="translate(16 9)" color="#454b6b">
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M32 39V10M24 41 12 18M40 41 52 18M18 46 5 34M46 46 59 34"/></g><circle cx="32" cy="51" r="8" fill="#f4a300"/>
</g><text x="97" y="32" font-size="14" font-weight="700">Ausgangspunkt · Entwurf 1</text><text x="97" y="56" font-size="14" fill="#595959">Fünf Strahlen und ein gelber Punkt. Der Bezug zur Fächerstadt bleibt der Kern.</text></g><g transform="translate(48 269)"><rect width="624" height="414" rx="18" fill="#fff"/><text x="28" y="40" font-size="15" font-weight="700">V1 · Ausgewogen</text><rect x="454" y="20" width="143" height="27" rx="13" fill="#eef0f5"/><text x="526" y="38" text-anchor="middle" font-size="10" letter-spacing="1" font-weight="700">MEIN FAVORIT</text><g transform="translate(30 86) scale(1.7)" color="#454b6b"><path d="M19 42.5 3.4 33.5M24.5 37 15.5 21.4M32 35V17M39.5 37l9-15.6M45 42.5l15.6-9" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="50" r="7" fill="#f4a300"/></g><text x="159" y="141" font-size="31" letter-spacing="-.8" font-weight="700">Fächerbagger</text><text x="160" y="168" font-size="14" fill="#595959">Baustellen Karlsruhe</text><text x="28" y="240" font-size="16" fill="#454b6b">Fünf gleichmäßige Strahlen, mehr Abstand zum Punkt.</text><text x="28" y="269" font-size="14" fill="#595959">Karlsruhe bleibt erkennbar; ruhiger als der erste Entwurf.</text><path d="M28 292H596" stroke="#eceef2"/><text x="28" y="320" font-size="11" fill="#595959">APP · 48 / 32 / 16 PX</text><rect x="28" y="332" width="48" height="48" rx="10.56" fill="#454b6b"/><g transform="translate(35.2 339.2) scale(0.5249999999999999)" color="#fff"><path d="M19 42.5 3.4 33.5M24.5 37 15.5 21.4M32 35V17M39.5 37l9-15.6M45 42.5l15.6-9" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="50" r="7" fill="#f4a300"/></g><rect x="88" y="348" width="32" height="32" rx="7.04" fill="#454b6b"/><g transform="translate(92.8 352.8) scale(0.35)" color="#fff"><path d="M19 42.5 3.4 33.5M24.5 37 15.5 21.4M32 35V17M39.5 37l9-15.6M45 42.5l15.6-9" fill="none" strok