<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1408" viewBox="0 0 1440 1408"><rect width="1440" height="1408" fill="#f4f5f7"/><g font-family="Arial, Helvetica, sans-serif" fill="#454b6b"><text x="56" y="52" font-size="12" letter-spacing="2.5">FÄCHERBAGGER / DREI VERFEINERTE ENTWÜRFE</text><text x="56" y="112" font-size="40" font-weight="700" letter-spacing="-.7">Der Fächer trifft die Schaufel.</text><text x="56" y="155" font-size="18" fill="#595959">Ein neues Zeichen aus beiden Favoriten. Dazu je eine gezielte Weiterentwicklung von V1 und A2.</text><g transform="translate(56 202)"><rect width="1328" height="358" rx="20" fill="#fff"/><text x="30" y="49" font-size="24" font-weight="700">N1 · Fächermulde</text><rect x="1069" y="24" width="227" height="31" rx="15.5" fill="#eef0f5"/><text x="1182" y="44" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1">NEUES DESIGN</text><g transform="translate(36 93) scale(2.5)" color="#454b6b"><path d="M22.47 32.50 8.62 24.50M26.50 28.47 18.50 14.62M32.00 27.00 32.00 11.00M37.50 28.47 45.50 14.62M41.53 32.50 55.38 24.50" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="m10 35 4 11c2 7 8 10 18 10s16-3 18-10l4-11" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="38" r="5.5" fill="#f4a300"/></g><text x="230" y="150" font-size="38" font-weight="700" letter-spacing="-1">Fächerbagger</text><text x="232" y="181" font-size="17" fill="#595959">Baustellen Karlsruhe</text><text x="230" y="229" font-size="17">Der Fächer wächst aus einer offenen Schaufel.</text><text x="230" y="259" font-size="15" fill="#595959">Fünf ruhige Strahlen, eine klare Kontur, ein gelber Mittelpunkt.</text><path d="M30 288H789" stroke="#eceef2"/><text x="30" y="323" font-size="16" fill="#595959">Verbindet die Leichtigkeit von V1 mit dem Baggerbezug von A2.</text><path d="M837 87V328" stroke="#eceef2"/><text x="876" y="105" font-