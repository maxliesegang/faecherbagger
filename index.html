<!doctype html>
<!--
  data-kern-theme pins the KERN token set. Without it KERN switches to its dark
  palette under a dark OS setting while the map, its legend and the phase hues
  stay light, which mixes the two schemes.
-->
<html lang="de" data-kern-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) report the real
      insets, which the fixed bottom navigation needs on notched iPhones.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#454b6b" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Fächerbagger – Baustellen"
      href="%BASE_URL%baustellen.xml"
    />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="Fächerbagger – Baustellen"
      href="%BASE_URL%baustellen.atom"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="Fächerbagger" />
    <link
      rel="apple-touch-icon"
      href="%BASE_URL%icons/apple-touch-icon.png"
    />
    <title>Fächerbagger – Baustellen in der Region Karlsruhe</title>
    <meta
      name="description"
      content="Aktuelle und geplante Straßenbaustellen in der Region Karlsruhe – verständlich als Karte und Tabelle."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
