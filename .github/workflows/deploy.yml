name: Deploy to GitHub Pages

# Builds the static site and deploys it to GitHub Pages. Runs on:
#   - pushes to main that touch source/config,
#   - manual dispatch,
#   - completion of the "Update data" workflow (data commits by GITHUB_TOKEN do
#     not trigger `push`, so we listen via workflow_run instead).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Update data"]
    types: [completed]

# Permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time; let the newest win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skip if the triggering data run failed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_PUSH_API_URL: ${{ vars.PUSH_API_URL }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    # Only data-update runs produce a broadcast. Device-local event receipts
    # suppress duplicates; the sender keeps the per-device daily guard.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Broadcast Baustellen changes
        env:
          PUSH_API_URL: ${{ vars.PUSH_API_URL }}
          APP_URL: ${{ vars.APP_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          PUSH_ADMIN_TOKEN: ${{ secrets.PUSH_ADMIN_TOKEN }}
        run: |
          if [[ -z "$PUSH_API_URL" || -z "$APP_URL" || -z "$VAPID_PUBLIC_KEY" || -z "$VAPID_PRIVATE_KEY" || -z "$VAPID_SUBJECT" || -z "$PUSH_ADMIN_TOKEN" ]]; then
            echo "Web Push is not configured; skipping broadcast."
          else
            npm run push:send
          fi
