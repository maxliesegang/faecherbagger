name: Update data

# Fetches the TRK WFS twice daily, normalizes it, and commits the static JSON
# and feeds under public/. A successful run triggers the Deploy workflow (see
# deploy.yml, which listens via workflow_run).
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC
    - cron: "0 16 * * *" # 16:00 UTC
  workflow_dispatch:

# Allow the job to push the regenerated data back to the branch.
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch & normalize
        run: npm run data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data public/baustellen.xml public/baustellen.atom; then
            echo "No data changes."
          else
            git add public/data public/baustellen.xml public/baustellen.atom
            git commit -m "chore(data): update Baustellen data [skip ci]"
            git push
          fi
