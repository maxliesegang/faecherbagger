name: Update data

# Fetches the TRK WFS twice daily, normalizes it, and commits the static JSON
# under public/data/. A successful run triggers the Deploy workflow (see
# deploy.yml, which listens via workflow_run).
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC
    - cron: "0 16 * * *" # 16:00 UTC
  workflow_dispatch:

# Allow the job to push the regenerated data back to the branch.
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch & normalize
        run: npm run data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data; then
            echo "No data changes."
          else
            git add public/data
            git commit -m "chore(data): update Baustellen data [skip ci]"
            git push
          fi
